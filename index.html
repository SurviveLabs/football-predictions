<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lower League Football Predictions</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --badge-bg: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 12px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .status-bar {
            display: inline-block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .predictions-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            border-color: var(--accent-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.8rem;
        }

        .league-badge {
            background-color: #334155;
            color: #e2e8f0;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.7rem;
        }

        .match-time {
            color: var(--text-muted);
            font-weight: 500;
        }

        .match-teams {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
            text-align: center;
        }

        .match-teams span {
            color: var(--accent-color);
            margin: 0 4px;
            font-weight: 400;
            font-size: 0.9rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.5);
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .prediction-pick {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        .match-odds {
            background-color: var(--badge-bg);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .confidence {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .state-msg {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>⚽ Lower League Picks</h1>
            <p id="last-updated">Checking for live predictions...</p>
            <div class="status-bar">⚡ Auto-Updated Live Data</div>
        </header>

        <main id="predictions-container">
            <div class="state-msg">🔄 Loading latest predictions...</div>
        </main>

        <footer>
            <p>Automated Football Predictions Platform • Powered by GitHub Actions</p>
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchPredictions();
        });

        async function fetchPredictions() {
            const container = document.getElementById("predictions-container");
            const lastUpdatedEl = document.getElementById("last-updated");

            // Cache-Busting Query Parameter (?t=timestamp) forces browser to pull fresh JSON every visit
            const cacheBusterUrl = `predictions.json?t=${new Date().getTime()}`;

            try {
                const response = await fetch(cacheBusterUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (lastUpdatedEl && data.last_updated) {
                    lastUpdatedEl.textContent = `Last Updated: ${data.last_updated}`;
                }

                const predictions = data.predictions || [];

                if (predictions.length === 0) {
                    container.innerHTML = `
                        <div class="state-msg">
                            ⚠️ No lower league predictions available for today or tomorrow.
                        </div>`;
                    return;
                }

                renderPredictions(predictions);

            } catch (error) {
                console.error("❌ Error fetching predictions.json:", error);
                container.innerHTML = `
                    <div class="state-msg" style="color: #ef4444;">
                        ❌ Failed to load predictions. Please refresh the page.
                    </div>`;
            }
        }

        function renderPredictions(predictions) {
            const container = document.getElementById("predictions-container");
            container.innerHTML = ""; // Clear loading message

            predictions.forEach((item) => {
                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <div class="card-header">
                        <span class="league-badge">${escapeHtml(item.league)}</span>
                        <span class="match-time">🗓️ ${escapeHtml(item.match_date)} • ⏰ ${escapeHtml(item.kickoff_wat)}</span>
                    </div>
                    <div class="match-teams">
                        ${escapeHtml(item.home_team)} <span>vs</span> ${escapeHtml(item.away_team)}
                    </div>
                    <div class="card-footer">
                        <div>
                            <div class="prediction-pick">👉 ${escapeHtml(item.prediction)}</div>
                            <div class="confidence">Confidence: ${escapeHtml(item.confidence)}</div>
                        </div>
                        <span class="match-odds">@${parseFloat(item.odds).toFixed(2)}</span>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Helper function to prevent XSS issues
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
