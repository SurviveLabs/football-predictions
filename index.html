<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survive Predictions — AI Football Analytics</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --gold-primary: #f5c518;
            --gold-soft: rgba(245, 197, 24, 0.15);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-green: #2ea44f;
            --accent-blue: #38bdf8;
            --glass-blur: blur(12px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 15px;
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* Hero Card for Best Picks */
        .featured-card {
            background: linear-gradient(135deg, rgba(245, 197, 24, 0.08) 0%, rgba(22, 27, 34, 0.9) 100%);
            border: 1px solid rgba(245, 197, 24, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .featured-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .featured-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold-primary);
        }

        .odds-badge {
            background: var(--gold-soft);
            color: var(--gold-primary);
            border: 1px solid rgba(245, 197, 24, 0.4);
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .best-pick-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 14, 20, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .match-info h4 {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .match-info p {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .pick-tag {
            text-align: right;
        }

        .pick-name {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* All Predictions Grid */
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            backdrop-filter: var(--glass-blur);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .card-match {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid var(--card-border);
        }

        .confidence {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 0.85rem;
        }

        #loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Survive Predictions</h1>
        <p id="last-updated">Updating live predictions...</p>
    </header>

    <section class="featured-card" id="best-picks-container" style="display: none;">
        <div class="featured-header">
            <div class="featured-title">🔥 Best Picks Today</div>
            <div class="odds-badge" id="total-odds">Odds: ~1.00</div>
        </div>
        <div id="best-picks-list"></div>
    </section>

    <h2 class="section-title">⚽ All Lower League Predictions</h2>
    <div id="loading">Loading today's fixtures...</div>
    <div class="grid" id="predictions-grid"></div>

    <script>
        async function loadPredictions() {
            try {
                const response = await fetch('./predictions.json');
                const data = await response.json();

                document.getElementById('last-updated').innerText = `Updated: ${data.last_updated || 'Just now'}`;

                // 1. Render Best Picks Section
                if (data.best_picks && data.best_picks.length > 0) {
                    const bestContainer = document.getElementById('best-picks-container');
                    const bestList = document.getElementById('best-picks-list');
                    document.getElementById('total-odds').innerText = `Combined Odds: ~${data.total_best_odds || '0.00'}`;
                    
                    bestList.innerHTML = data.best_picks.map(item => `
                        <div class="best-pick-item">
                            <div class="match-info">
                                <h4>${item.flag || '🌐'} ${item.match}</h4>
                                <p>🗓️ ${item.match_date || 'Today'} • ${item.league} • ⏰ ${item.kickoff_wat}</p>
                            </div>
                            <div class="pick-tag">
                                <span class="pick-name">${item.prediction}</span>
                            </div>
                        </div>
                    `).join('');

                    bestContainer.style.display = 'block';
                }

                // 2. Render All Predictions
                const grid = document.getElementById('predictions-grid');
                document.getElementById('loading').style.display = 'none';

                if (data.predictions && data.predictions.length > 0) {
                    grid.innerHTML = data.predictions.map(item => `
                        <div class="card">
                            <div class="card-meta">
                                <span>${item.flag || '🌐'} ${item.league}</span>
                                <span>🗓️ ${item.match_date || 'Today'} • ⏰ ${item.kickoff_wat}</span>
                            </div>
                            <div class="card-match">${item.match}</div>
                            <div class="card-footer">
                                <span class="pick-name">${item.prediction}</span>
                                <span class="confidence">${item.confidence}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    grid.innerHTML = '<p style="color:var(--text-muted);">No lower league matches available at the moment.</p>';
                }

            } catch (error) {
                console.error("Error loading predictions:", error);
                document.getElementById('loading').innerText = "Unable to load predictions. Please refresh.";
            }
        }

        loadPredictions();
    </script>
</body>
</html>
