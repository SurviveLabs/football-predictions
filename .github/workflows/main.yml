name: Update Predictions

on:
  schedule:
    - cron: '0 6 * * *'   # Runs daily at 7:00 AM WAT (06:00 UTC)
    - cron: '0 14 * * *'  # Runs daily at 3:00 PM WAT (14:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Predictions & Broadcast to Telegram
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and Push Updated Predictions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update predictions.json [skip ci]"
          file_pattern: "predictions.json"
          
