name: Update Predictions

on:
  schedule:
    - cron: '0 6,14 * * *'  # Runs daily at 7:00 AM & 3:00 PM WAT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

            - name: Fetch Predictions & Broadcast to Telegram
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # Ensures predictions.json updates live on your web app
      - name: Commit and Push Updated Predictions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update predictions.json [skip ci]"
          file_pattern: "predictions.json"
          
          
